name: Build npm Package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Install Rust WASI target
        run: rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache offline decompilers
        id: decompilers
        uses: actions/cache@v5
        with:
          path: |
            gui/public/kuna
            gui/public/ddc
          key: decompilers-${{ hashFiles('scripts/build-kuna.ts', 'scripts/build-ddc.ts', 'externals/kuna/**', 'externals/ddc/**') }}

      - name: Build offline decompilers
        if: steps.decompilers.outputs.cache-hit != 'true'
        run: |
          npm run build:kuna
          npm run build:ddc

      - name: Fetch pinned signature database
        run: npm run fetch:signatures

      - name: Install and build
        run: |
          npm ci
          npm ci --prefix agent
          npm ci --prefix gui

      - name: Check radare2 WASI plugins
        run: npm run check:r2-wasm -- radare2.wasm externals/radare/r2flutter/test/bins/android/first/libapp.so

      - name: Package
        run: npm pack

      - name: Upload Archive
        uses: actions/upload-artifact@v6
        with:
          name: igf.tgz
          path: igf-*.tgz
