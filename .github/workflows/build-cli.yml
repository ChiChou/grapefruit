name: Build Single Executable Tool

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "agent/**"
      - "gui/**"
      - "scripts/**"
      - "externals/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "tsdown.sea.config.ts"
      - ".github/actions/setup/**"
      - ".github/workflows/build-cli.yml"

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Install Rust WASI target
        run: rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache offline decompilers
        id: decompilers
        uses: actions/cache@v5
        with:
          path: |
            gui/public/kuna
            gui/public/ddc
          key: decompilers-${{ hashFiles('scripts/build-kuna.ts', 'scripts/build-ddc.ts', 'externals/kuna/**', 'externals/ddc/**') }}

      - name: Build offline decompilers
        if: steps.decompilers.outputs.cache-hit != 'true'
        run: |
          npm run build:kuna
          npm run build:ddc

      - name: Install and build assets
        run: |
          npm ci
          npm ci --prefix agent
          npm ci --prefix gui

      - name: Check radare2 WASI plugins
        run: npm run check:r2-wasm -- radare2.wasm externals/radare/r2flutter/test/bins/android/first/libapp.so

      - name: Check offline decompilers
        run: npm run check:decompilers

      - name: Upload application assets
        uses: actions/upload-artifact@v6
        with:
          name: application-assets
          path: |
            agent/dist
            agent/types
            gui/dist
            radare2.wasm

  build:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download application assets
        uses: actions/download-artifact@v6
        with:
          name: application-assets
          path: .

      - name: Build executable
        run: npm run build:cli

      - name: Smoke test
        shell: bash
        run: ./build/Release/igf-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }} --help

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.name }}
          path: build/Release/igf-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}

  archive:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - uses: actions/upload-artifact@v6
        with:
          name: cli-binaries
          path: cli/
